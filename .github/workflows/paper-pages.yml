name: Deploy research paper to Pages

on:
  push:
    branches: [main]
    paths:
      - "work/paper/**"
      - "work/figures/**"
      - "work/research_paper.md"
      - ".github/workflows/paper-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static paper site
        run: |
          mkdir -p _paper_site/assets
          cp work/paper/index.html _paper_site/
          cp work/paper/styles.css _paper_site/
          cp work/paper/script.js _paper_site/
          cp work/figures/*.png _paper_site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _paper_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
